<div class="layout-container">

  <!-- MENÚ LATERAL -->
  <aside class="sidebar">
    <div class="sidebar-brand">
      <div class="brand-badge">🔄</div>
      <h2>Skill<span>Swap</span></h2>
    </div>

    <nav class="sidebar-nav">
      <a *ngFor="let item of visibleItems"
         [routerLink]="item.path"
         routerLinkActive="active-link"
         class="nav-link">
        <span class="nav-icon">{{ item.icon }}</span>
        <span>{{ item.label }}</span>
      </a>
    </nav>

    <!-- SELECTOR DE TEMA DE COLOR -->
    <div class="theme-switcher">
      <span class="theme-switcher-label">Tema de color</span>
      <div class="theme-dots">
        <button *ngFor="let t of themes"
                class="theme-dot"
                [class.active-dot]="currentTheme === t.id"
                [style.background]="t.color"
                (click)="setTheme(t.id)"
                [title]="t.label"
                [attr.aria-label]="'Tema ' + t.label">
        </button>
      </div>
    </div>

    <div class="sidebar-user">
      <div class="user-avatar">{{ username.charAt(0).toUpperCase() }}</div>
      <div class="user-data">
        <strong>{{ username }}</strong>
        <span>{{ roleLabel }}</span>
      </div>
      <button class="btn-logout-side" (click)="logout()" title="Cerrar Sesión">⏻</button>
    </div>
  </aside>

  <!-- CONTENIDO DE CADA PÁGINA -->
  <main class="layout-content">
    <router-outlet></router-outlet>
  </main>

</div>
